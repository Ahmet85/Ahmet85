<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="../reef.js"></script>
<script>
const W = 780, H = 600, c = document.getElementById('c'), ctx = c.getContext('2d'), d = Math.min(devicePixelRatio, 2);
c.width = W * d; c.height = H * d; c.style.width = W + 'px'; c.style.height = H + 'px'; ctx.scale(d, d);
const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3cc7f0'); g.addColorStop(1, '#0b5d8f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
const put = (a, x, y) => ctx.drawImage(a.img, x - a.ox, y - a.oy, a.cw, a.ch);
for (const [k, x, y, w, tier, s] of [['mossy', 90, 110, 70, 1, 1], ['spiky', 230, 110, 70, 1, 2], ['cave', 400, 110, 90, 1, 3], ['mossy', 560, 110, 60, 2, 4], ['cave', 690, 110, 80, 3, 5]]) {
  const a = OktoReef.make(k, w, tier, s); put(a, x, y);
  ctx.strokeStyle = 'rgba(255,0,0,.6)'; ctx.lineWidth = 1; for (const h of a.hit) { ctx.beginPath(); ctx.arc(x + h.x, y + h.y, h.r, 0, 6.28); ctx.stroke(); }
  if (a.mouth) { ctx.strokeStyle = 'rgba(0,255,0,.8)'; ctx.beginPath(); ctx.arc(x + a.mouth.x, y + a.mouth.y, a.mouth.r, 0, 6.28); ctx.stroke(); }
}
for (const [side, y, len] of [[-1, 330, 100], [1, 420, 110]]) { const a = OktoReef.make('ledge', len, 1, 9, side); const x = side < 0 ? 0 : W; put(a, x, y); ctx.strokeStyle = 'rgba(255,0,0,.6)'; for (const h of a.hit) { ctx.beginPath(); ctx.arc(x + h.x, y + h.y, h.r, 0, 6.28); ctx.stroke(); } }
OktoReef.drawCanyon(ctx, W, H, 0, 0.0, 1, 60);
const s1 = OktoReef.silhouette('reef', 120, 3, 'rgba(10,60,110,.5)'); put(s1, 300, 300);
const s2 = OktoReef.silhouette('school', 120, 3, 'rgba(10,60,110,.5)'); put(s2, 450, 300);
const s3 = OktoReef.silhouette('wreck', 160, 3, 'rgba(10,60,110,.5)'); put(s3, 300, 480);
const f = OktoReef.frond(70, 4, -1); put(f, 0, 450);
OktoReef.drawSeabed(ctx, W, H, 1, 1, 0);
window.ready = true;
</script></body></html>
